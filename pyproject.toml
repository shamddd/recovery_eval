[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "recovery_eval"
version = "1.0.0"
description = "State-Matched and Provenance-Aware Evaluation of Recovery Behavior in Language-Model Reasoning"
authors = [
  { name="Sham Satish Thakare", email="shamthakare@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
